<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zona Fighters</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bs:clamp(58px,15vmin,92px);--fg:#fff}
html,body{height:100%;margin:0;background:#000;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Press Start 2P",ui-monospace,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#wrap{position:relative;width:min(100vw,calc(100vh*1.7778));width:min(100vw,calc(100dvh*1.7778))}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#000;touch-action:none}
#tp,.cb{display:none}
#tp{position:fixed;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none;z-index:5}
#tp>*{pointer-events:auto;touch-action:none}
#stick{position:relative;width:clamp(120px,32vmin,180px);height:clamp(120px,32vmin,180px);border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(255,255,255,.45)}
#act{display:grid;grid-template-columns:repeat(2,var(--bs));grid-template-rows:repeat(2,var(--bs));gap:clamp(10px,2.4vmin,18px)}
#act b{width:var(--bs);height:var(--bs);box-sizing:border-box;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font:400 clamp(9px,2.4vmin,13px) "Press Start 2P",monospace;display:flex;align-items:center;justify-content:center;text-shadow:0 0 3px #000;touch-action:none}
#act b.p{border-color:rgba(255,130,110,.85)}#act b.k{border-color:rgba(120,195,255,.85)}
#act .on{background:rgba(255,210,63,.6)}
.cb{position:fixed;top:max(8px,env(safe-area-inset-top));width:44px;height:44px;border:3px solid rgba(255,255,255,.5);border-radius:8px;background:rgba(0,0,0,.4);color:#fff;font:12px "Press Start 2P",monospace;touch-action:none;z-index:6}
#fs{left:max(8px,env(safe-area-inset-left))}#pz{right:max(8px,env(safe-area-inset-right))}
@media (pointer:coarse){#tp{display:flex}.cb{display:block}}
@media (pointer:coarse) and (orientation:portrait){body{align-items:flex-start}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="tp"><div id="stick"><i id="knob"></i></div><div id="act"><b class="p" data-t="lp">LP</b><b class="p" data-t="hp">HP</b><b class="k" data-t="lk">LK</b><b class="k" data-t="hk">HK</b></div></div>
<button class="cb" id="fs">⛶</button><button class="cb" id="pz" data-t="st">II</button>

const keys={},press={};

addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code=='Space'||e.code=='Tab'||e.code=='Backspace')e.preventDefault();kd(e.code);audio()});
addEventListener('keyup',e=>keys[e.code]=0);

/* ---------- dados ---------- */
function hue(h,d){const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,gg=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2,q=mx-mn;let H=0,S=0;
 if(q){S=l>.5?q/(2-mx-mn):q/(mx+mn);H=(mx==r?(gg-b)/q+(gg<b?6:0):mx==gg?(b-r)/q+2:(r-gg)/q+4)*60}
 const hx=a=>Math.round(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,'0');
 if(S<.15){const l2=l<.5?l+.38:l-.38;return '#'+hx(l2)+hx(l2)+hx(l2+.06)}
 H=(H+d)%360;const c=(1-Math.abs(2*l-1))*S,x=c*(1-Math.abs(H/60%2-1)),m=l-c/2,v=H<60?[c,x,0]:H<120?[x,c,0]:H<180?[0,c,x]:H<240?[0,x,c]:H<300?[x,0,c]:[c,0,x];return '#'+hx(v[0]+m)+hx(v[1]+m)+hx(v[2]+m)}
const ALTC={},PL=f=>f.alt?(ALTC[f.id]||(ALTC[f.id]=[hue(TOP[f.id],150),hue(BOT[f.id],150),hue(CL[f.id],150)])):[TOP[f.id],BOT[f.id],CL[f.id]];
let OPT={diff:1,time:1,cont:3,fs:1};try{OPT=Object.assign(OPT,JSON.parse(localStorage.getItem('zf_opt')||'{}'))}catch(e){}
let REC=[];try{REC=JSON.parse(localStorage.getItem('zf_rec')||'[]')}catch(e){}
const saveO=()=>{try{localStorage.setItem('zf_opt',JSON.stringify(OPT))}catch(e){}},saveR=()=>{try{localStorage.setItem('zf_rec',JSON.stringify(REC))}catch(e){}};

const mvc=(id,dx,dy)=>{let c=POS[id][0],r=POS[id][1]+dy;if(r<0||r>1)return id;c=Math.max(0,Math.min(GR[r].length-1,c+dx));return GR[r][c]};
